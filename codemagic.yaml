workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Clean Flutter Cache
        script: |
          flutter clean
      - name: Fix Package Name and Build
        script: |
          # Questo comando corregge l'ID direttamente sul server prima della build
          sed -i '' 's/com.example.flolk1/com.flolk.app/g' android/app/build.gradle
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
